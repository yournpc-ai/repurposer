<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配方画廊演示 v5.5 — 7 张 · ChatGPT 测试后</title>
<style>
  :root { --bg: #141414; --fg: #f2f2f2; --muted: #a3a3a3; --meta: #7a7a7a; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    background-image: radial-gradient(circle, rgba(255,255,255,.13) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--fg);
    font-family: -apple-system, "SF Pro", "PingFang SC", "Helvetica Neue", sans-serif;
    min-height: 100vh; padding: 40px 24px 80px;
  }
  .note { max-width: 1152px; margin: 0 auto 4px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
  .note b { color: var(--fg); font-weight: 500; }
  h2 { text-align: center; font-size: 20px; font-weight: 500; margin: 14px 0 24px; }

  .grid {
    max-width: 1152px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px 16px;
  }
  .card { position: relative; cursor: pointer; }
  .tile {
    position: relative; overflow: hidden; border-radius: 8px;
    aspect-ratio: 16 / 10; background: #0A0A0B; width: 100%;
  }
  .tile svg.schem { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* 文字区在媒体下方：三行，逐行对齐 */
  .info { padding: 10px 2px 0; }
  .title { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
  .promise {
    margin-top: 3px; font-size: 12px; line-height: 1.55; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 37px;
  }
  .input { margin-top: 4px; font-size: 11px; letter-spacing: .04em; color: var(--meta); }

  /* hover 操作件：Remix 居中 + 展开右上（两者都开检视 overlay） */
  .trio { opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 2; }
  .card:hover .trio { opacity: 1; pointer-events: auto; }
  .remix {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.92); color: #000;
    border: none; border-radius: 999px; padding: 0 16px; height: 36px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .iconbtn {
    position: absolute; width: 32px; height: 32px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.16); backdrop-filter: blur(6px);
    border-radius: 999px; color: #fff;
  }
  .expand { right: 10px; top: 10px; }
  .iconbtn svg { width: 14px; height: 14px; }

  /* ── hover 工艺动画：rest 静止，hover 图示"播放"转换过程 ── */
  .tile svg.schem .cap, .tile svg.schem .cap2, .tile svg.schem .vp,
  .tile svg.schem .tl, .tile svg.schem .qm { transform-box: fill-box; }
  .tile svg.schem .tl { transform-origin: left center; }
  .tile svg.schem .qm { transform-origin: center; }
  .tile svg.schem .wb rect { transform-box: fill-box; transform-origin: center; }

  @keyframes chipA { 0%,40%,100% { opacity: 1 } 55%,85% { opacity: .15 } }
  @keyframes chipB { 0%,40%,100% { opacity: .15 } 55%,85% { opacity: 1 } }
  @keyframes capGrow { 0% { transform: scaleX(.15) } 55%,100% { transform: scaleX(1) } }
  @keyframes brPulse { 0%,100% { opacity: .3 } 35% { opacity: 1 } }
  @keyframes vpSlide { 0%,18% { transform: translateX(0) } 50%,68% { transform: translateX(150px) } 86%,100% { transform: translateX(0) } }
  @keyframes capFade { 0% { opacity: 0; transform: translateY(5px) } 30%,75% { opacity: 1; transform: translateY(0) } 100% { opacity: 0 } }
  @keyframes dashFlow { to { stroke-dashoffset: -14 } }
  @keyframes wbBounce { 0%,100% { transform: scaleY(.55) } 50% { transform: scaleY(1) } }
  @keyframes lineGrow { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }
  @keyframes qPulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12) } }

  .card:hover .sc-subs .chip-en, .card:hover .sc-dub .chip-en { animation: chipA 2.4s ease-in-out infinite; }
  .card:hover .sc-subs .chip-zh, .card:hover .sc-dub .chip-zh { animation: chipB 2.4s ease-in-out infinite; }
  .card:hover .sc-subs .cap { transform-origin: left center; animation: capGrow 2s ease-out infinite; }

  .card:hover .sc-dub .wb rect { animation: wbBounce 1.1s ease-in-out infinite; }
  .card:hover .sc-dub .wb rect:nth-child(2) { animation-delay: .09s; }
  .card:hover .sc-dub .wb rect:nth-child(3) { animation-delay: .18s; }
  .card:hover .sc-dub .wb rect:nth-child(4) { animation-delay: .27s; }
  .card:hover .sc-dub .wb rect:nth-child(5) { animation-delay: .36s; }
  .card:hover .sc-dub .wb rect:nth-child(6) { animation-delay: .45s; }
  .card:hover .sc-dub .wb rect:nth-child(7) { animation-delay: .54s; }
  .card:hover .sc-dub .wb rect:nth-child(8) { animation-delay: .63s; }

  .card:hover .sc-highlight .br { animation: brPulse 1.6s ease-in-out infinite; }
  .card:hover .sc-highlight .br2 { animation-delay: .28s; }
  .card:hover .sc-highlight .br3 { animation-delay: .56s; }

  .card:hover .sc-reframe .vp { animation: vpSlide 3s ease-in-out infinite; }

  .card:hover .sc-imageVideo .cap2 { animation: capFade 2.2s ease-out infinite; }
  .card:hover .sc-imageVideo .arrp, .card:hover .sc-carousel .arrp { stroke-dasharray: 5 5; animation: dashFlow .8s linear infinite; }

  .card:hover .sc-post .tl1 { animation: lineGrow 1.4s ease-out both; }
  .card:hover .sc-post .tl2 { animation: lineGrow 1.4s ease-out .15s both; }
  .card:hover .sc-post .tl3 { animation: lineGrow 1.4s ease-out .3s both; }
  .card:hover .sc-post .tl4 { animation: lineGrow 1.4s ease-out .45s both; }

  .card:hover .sc-quote .qm { animation: qPulse 2s ease-in-out infinite; }

  .card:hover .sc-carousel .fr { animation: brPulse 1.6s ease-in-out infinite; }
  .card:hover .sc-carousel .f2 { animation-delay: .28s; }
  .card:hover .sc-carousel .f3 { animation-delay: .56s; }

  @media (max-width: 1000px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<p class="note">v5.6：<b>社媒帖回列</b>——闸门修订为两级：①场景真实性（一票否决，语音转观点出列）②形态或环路不可替代（社媒帖的环路写在 promise 上：你的风格 + 平台由你定）。8 张 4×2，rest 静止 · hover 播工艺动画 · click = 检视 overlay。</p>

  card.innerHTML = `

</script>

</body>
</html>
