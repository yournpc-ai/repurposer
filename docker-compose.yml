services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repurposer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repurposer"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # The host path comes from .env. Both containers use a stable mount path.
      - &managed_skill_mount
        type: bind
        source: ${MANAGED_SKILL_ROOT:-./apps/api/app/skills}
        target: /opt/repurposer/skills
        read_only: true
        bind:
          create_host_path: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/repurposer
      - MANAGED_SKILL_ROOT=/opt/repurposer/skills
      - MANAGED_SKILL_VERSIONS=${MANAGED_SKILL_VERSIONS:-{}}
      - LLM_PROVIDER=${LLM_PROVIDER:-minimax}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-M3.1-Flash}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimax.chat/v1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-flash}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-high}
      - DEEPSEEK_MAX_OUTPUT_TOKENS=${DEEPSEEK_MAX_OUTPUT_TOKENS:-32768}
      - DEEPSEEK_CNY_PER_USD=${DEEPSEEK_CNY_PER_USD:-7.2}
      - DEEPSEEK_OFFPEAK_DATES=${DEEPSEEK_OFFPEAK_DATES:-}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL:-Rookie Cut <repurposer@yournpc.ai>}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRE_DAYS=${JWT_EXPIRE_DAYS:-30}
      - API_PUBLIC_URL=http://api:8000
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL:-https://repurposer.yournpc.ai}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - RENDER_URL=http://render:3001/render
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_PRIVATE_EXPORT_BUCKET=${S3_PRIVATE_EXPORT_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_REGION=${S3_REGION:-ap-southeast-1}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - S3_PRESIGN_UPLOAD_TTL=${S3_PRESIGN_UPLOAD_TTL:-3600}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - CHANNEL_CREDENTIALS_KEY=${CHANNEL_CREDENTIALS_KEY}
      - CHROME_PATH=/usr/bin/chromium
      - CHROME_NO_SANDBOX=true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: python -m app.worker
    volumes:
      - *managed_skill_mount
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/repurposer
      - MANAGED_SKILL_ROOT=/opt/repurposer/skills
      - MANAGED_SKILL_VERSIONS=${MANAGED_SKILL_VERSIONS:-{}}
      - LLM_PROVIDER=${LLM_PROVIDER:-minimax}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-M3.1-Flash}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimax.chat/v1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-flash}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-high}
      - DEEPSEEK_MAX_OUTPUT_TOKENS=${DEEPSEEK_MAX_OUTPUT_TOKENS:-32768}
      - DEEPSEEK_CNY_PER_USD=${DEEPSEEK_CNY_PER_USD:-7.2}
      - DEEPSEEK_OFFPEAK_DATES=${DEEPSEEK_OFFPEAK_DATES:-}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL:-Rookie Cut <repurposer@yournpc.ai>}
      - PAYMENT_ALERT_RECIPIENTS=${PAYMENT_ALERT_RECIPIENTS:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRE_DAYS=${JWT_EXPIRE_DAYS:-30}
      - API_PUBLIC_URL=http://api:8000
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL:-https://repurposer.yournpc.ai}
      - RENDER_URL=http://render:3001/render
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_PRIVATE_EXPORT_BUCKET=${S3_PRIVATE_EXPORT_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_REGION=${S3_REGION:-ap-southeast-1}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - S3_PRESIGN_UPLOAD_TTL=${S3_PRESIGN_UPLOAD_TTL:-3600}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - CHANNEL_CREDENTIALS_KEY=${CHANNEL_CREDENTIALS_KEY}
      - CHROME_PATH=/usr/bin/chromium
      - CHROME_NO_SANDBOX=true
    depends_on:
      db:
        condition: service_healthy
      render:
        condition: service_started
    restart: unless-stopped

  render:
    build:
      context: .
      dockerfile: apps/render/Dockerfile
    environment:
      - RENDER_PORT=3001
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_DISCORD_URL=${VITE_DISCORD_URL:-}
        - VITE_YOUTUBE_URL=${VITE_YOUTUBE_URL:-}
        - VITE_X_URL=${VITE_X_URL:-}
        - VITE_WECHAT_GROUP_QR_URL=${VITE_WECHAT_GROUP_QR_URL:-}
        - VITE_SUPPORT_EMAIL=${VITE_SUPPORT_EMAIL:-}
        - VITE_TERMS_URL=${VITE_TERMS_URL:-}
        - VITE_PRIVACY_URL=${VITE_PRIVACY_URL:-}
        - VITE_REFUND_POLICY_URL=${VITE_REFUND_POLICY_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
